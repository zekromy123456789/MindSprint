name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test on an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          xcrun simctl list devices available -j > artifacts/logs/simulators.json
          SIMULATOR_ID=$(python3 scripts/select_simulator.py < artifacts/logs/simulators.json)
          xcodebuild test -project MindSprint.xcodeproj -scheme MindSprint \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath artifacts/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/logs/test.log
      - name: Build unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -project MindSprint.xcodeproj -scheme MindSprint \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MindSprintDerivedData" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/logs/device-build.log
          APP="$RUNNER_TEMP/MindSprintDerivedData/Build/Products/Release-iphoneos/MindSprint.app"
          test -d "$APP"
          mkdir -p artifacts/Payload
          ditto "$APP" artifacts/Payload/MindSprint.app
          lipo -archs artifacts/Payload/MindSprint.app/MindSprint | tee artifacts/logs/architectures.txt
          lipo artifacts/Payload/MindSprint.app/MindSprint -verify_arch arm64
          (cd artifacts && ditto -c -k --keepParent Payload MindSprint-unsigned.ipa)
          unzip -t artifacts/MindSprint-unsigned.ipa | tee artifacts/logs/ipa-validation.txt
          unzip -l artifacts/MindSprint-unsigned.ipa | tee -a artifacts/logs/ipa-validation.txt
          unzip -l artifacts/MindSprint-unsigned.ipa | grep -F 'Payload/MindSprint.app/MindSprint'
      - name: Upload unsigned device IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MindSprint-unsigned-device-ipa
          path: artifacts/MindSprint-unsigned.ipa
          if-no-files-found: error
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MindSprint-build-logs
          path: |
            artifacts/logs
            artifacts/TestResults.xcresult
          if-no-files-found: warn


